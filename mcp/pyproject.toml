[project]
name = "belfast-review-bridge"
version = "0.1.0"
description = "MCP bridge for Cursor ↔ Antigravity Belfast feature reviews"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
