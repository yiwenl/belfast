<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belfast — Courtyard 02</title>
  </head>
  <body>
    <canvas aria-label="Interactive courtyard Gaussian splat scene"></canvas>
    <aside>Drag to orbit · Shift + drag to pan · Scroll to zoom</aside>
    <section id="marker-controls" aria-label="Flower position inspection">
      <label
        ><input id="flower-markers" type="checkbox" checked disabled />
        <span id="marker-info">Flower sources</span></label
      >
      <span><i class="likely"></i>Likely · <i class="review"></i>Review</span>
      <span>Markers shown in front</span>
    </section>
    <p id="status" role="status">Loading scene…</p>
    <pre id="error" role="alert" hidden></pre>
    <script type="module" src="./web/main.ts"></script>
  </body>
</html>
